<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sách</title>
    <style>
        
         /* Đặt màu nền cho trang */
         body {
            background-color: #f0f8ff; /* Màu xanh dương nhạt */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #1e90ff; /* Màu xanh dương đậm */
            padding: 20px 0;
        }

        /* Chỉnh lại bảng */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd; /* Màu xám nhạt cho viền */
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #87cefa; /* Màu xanh dương nhạt cho tiêu đề bảng */
            color: white;
        }

        tr:nth-child(even) {
            background-color: #e0f7fa; /* Màu nền nhạt cho các hàng chẵn */
        }

        tr:hover {
            background-color: #d1e7fd; /* Màu nền khi di chuột qua các hàng */
        }


        a:hover {
            text-decoration: underline;
        }

        .no-image {
            color: #888;
            font-style: italic;
        }
        a {
            display: inline-block;
            background-color: #01579b;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
    <!-- <link rel="stylesheet" href="book_list.css"> -->
</head>
<body>
    <h2>Danh sách Sách</h2>
    <table>
        <thead>
            <tr>
                <th>Bìa sách</th>
                <th>Tiêu đề</th>
                <th>Tác giả</th>
                <th>Giá</th>
                <th>Chi tiết</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td> 
                    <style>
                        img {
            width : 30%; 
            height: auto; /* Giữ tỷ lệ khung hình của hình ảnh */
        }
                    </style>
                    {% if book.photo %}
                        <img src="{{ book.photo.url }}" alt="{{ book.title }}">
                    {% else %}
                        <p class="no-image">No image available</p>
                    {% endif %}
                </td>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.price }} VND</td>
                <td><a href="{% url 'book_detail' book.id %}">Xem chi tiết</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
